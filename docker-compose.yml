services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uht
      POSTGRES_USER: uht
      POSTGRES_PASSWORD: uht-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - uht-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uht -d uht"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  uht-postgres-data:
