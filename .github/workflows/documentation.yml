name: Repository and Phase 11 validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uht_ci
          POSTGRES_USER: uht_ci
          POSTGRES_PASSWORD: uht-ci-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uht_ci -d uht_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://uht_ci:uht-ci-development-only@127.0.0.1:5432/uht_ci
      SESSION_SECRET: ci-session-secret-not-for-production
      CSRF_SECRET: ci-csrf-secret-not-for-production
      UHT_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Phase 11 API dependencies
        run: python3 -m pip install -r apps/api/requirements.txt
      - name: Validate repository content
        run: python3 scripts/validate_repository.py
      - name: Validate knowledge graph relationships
        run: python3 scripts/validate-knowledge.py
      - name: Validate Phase 6 lab definitions and safety
        run: python3 scripts/validate-labs.py
      - name: Check generated lab reports
        run: python3 scripts/generate-lab-reports.py --check
      - name: Check generated tool index
        run: python3 scripts/generate-index.py --check
      - name: Validate search and knowledge contracts
        run: python3 scripts/validate-schemas.py
      - name: Validate Phase 4 quality reports
        run: python3 scripts/validate-quality.py
      - name: Validate Phase 5 trust and evidence reports
        run: python3 scripts/validate-trust.py
      - name: Check generated trust artifacts
        run: python3 scripts/generate-trust-reports.py --check
      - name: Check generated quality reports
        run: python3 scripts/generate-quality-reports.py --check
      - name: Check generated search artifacts
        run: python3 scripts/generate-search.py --check
      - name: Check Phase 9 graph health artifact
        run: python3 scripts/generate-graph-intelligence.py --check
      - name: Check relative Markdown links
        run: python3 scripts/check-links.py
      - name: Check Python syntax
        run: python3 -m py_compile scripts/*.py search/**/*.py tests/*.py labs/engine/**/*.py labs/runners/*.py && find apps/api -name '*.py' -print0 | xargs -0 python3 -m py_compile
      - name: Check unsafe execution and network primitives
        run: '! grep -RInE "\\beval\\(|\\bexec\\(|shell=True|import (requests|urllib|socket)" search scripts/*.py labs/engine labs/runners'
      - name: Check obvious secret patterns
        run: '! grep -RInE "(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,})" --exclude-dir=.git .'
      - name: Run Phase 3 through Phase 11 deterministic engine tests
        run: python3 -m unittest discover -s tests -v
      - name: Exercise PostgreSQL Phase 8–11 migration lifecycle
        run: cd apps/api && PYTHONPATH=. alembic upgrade head && PYTHONPATH=. alembic downgrade base && PYTHONPATH=. alembic upgrade head
      - name: Run Phase 7–11 API, private-state, community RBAC, and production-hardening tests
        run: PYTHONPATH=apps/api:. python3 -m unittest discover -s apps/api/tests -v
      - name: Check Phase 11 OpenAPI contract freshness
        run: PYTHONPATH=apps/api:. python3 apps/api/scripts/check_openapi.py
      - name: Check Phase 11 API route-security matrix freshness
        run: PYTHONPATH=apps/api:. python3 apps/api/scripts/generate_route_security_matrix.py --check
      - name: Check Phase 11 migration preflight against CI PostgreSQL
        run: PYTHONPATH=apps/api:. python3 apps/api/scripts/migration_preflight.py
      - name: Confirm production check does not falsely pass outside production configuration
        run: '! PYTHONPATH=apps/api:. python3 apps/api/scripts/production_check.py'
      - name: Check Phase 11 production-readiness report freshness
        run: python3 scripts/generate-production-readiness.py --check
      - name: Check generated knowledge artifacts
        run: python3 scripts/generate-knowledge.py --check
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "11.21.0"
      - name: Install Phase 11 web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Run Phase 7–11 web route and boundary tests
        working-directory: apps/web
        run: pnpm test
      - name: Check Phase 11 explicit production browser configuration
        working-directory: apps/web
        run: UHT_ENVIRONMENT=production NEXT_PUBLIC_API_URL=https://api.example.test/api/v1 NEXT_PUBLIC_SITE_URL=https://app.example.test pnpm production-check
      - name: Type-check Phase 11 web client
        working-directory: apps/web
        run: pnpm typecheck
      - name: Build Phase 11 web client
        working-directory: apps/web
        run: UHT_ENVIRONMENT=development NODE_ENV=production pnpm build
